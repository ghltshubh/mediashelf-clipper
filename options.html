<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px/1.5 -apple-system, sans-serif; margin: 16px; min-width: 340px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; padding: 6px 8px; box-sizing: border-box; font: inherit; }
    button { margin-top: 10px; padding: 6px 14px; font: inherit; }
    #status { margin-top: 8px; font-size: 13px; color: #1a7f37; }
    p.hint { color: #666; font-size: 12.5px; }
  </style>
</head>
<body>
  <label for="url">MediaShelf URL</label>
  <input id="url" type="url" placeholder="http://127.0.0.1:8000" />
  <p class="hint">The address you open MediaShelf at, e.g. <code>http://192.168.1.50:8000</code>.
     Saving asks Chrome for permission to talk to that address.</p>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
