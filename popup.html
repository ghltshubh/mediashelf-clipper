<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --brass: #e3a84c; --bg: #14161a; --fg: #e8e6e3; --muted: #9aa0a6; }
    body {
      margin: 0; width: 300px; background: var(--bg); color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .wrap { padding: 14px; }
    h1 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--brass); }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 11px; }
    button {
      width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; cursor: pointer;
      background: var(--brass); color: var(--bg); font: inherit; font-weight: 600;
    }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    #status a { color: var(--brass); }
    .ok { color: #7bc47f; } .warn { color: #c9a227; } .err { color: #e08a5f; }
    .muted { color: var(--muted); }
    a { color: var(--brass); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .foot {
      border-top: 1px solid #ffffff14; padding: 9px 14px;
      font-size: 11px; color: var(--muted);
      display: flex; justify-content: space-between; gap: 8px;
    }
    #target { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #autorow { border-top: 1px solid #ffffff14; padding: 11px 14px; }
    .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; }
    .switch input { accent-color: var(--brass); }
    #autodetail {
      display: none; align-items: center; gap: 7px;
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }
    #autodetail.open { display: flex; }
    #autoevery {
      border-radius: 6px; border: 1px solid #ffffff24; background: #0f1114;
      color: var(--fg); font: inherit; padding: 3px 6px;
    }
    #runnow {
      width: auto; margin-left: auto; padding: 4px 10px; font-size: 11px;
      background: transparent; color: var(--brass); border: 1px solid var(--brass);
    }
    #autonote { margin-top: 7px; font-size: 11px; color: var(--muted); line-height: 1.45; }
    #urlrow { display: none; padding: 0 14px 12px; }
    #urlrow.open { display: block; }
    #urlrow label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px;
      border: 1px solid #ffffff24; background: #0f1114; color: var(--fg);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #saveurl { width: auto; padding: 6px 12px; font-size: 12px; }
    #urlnote { margin-top: 6px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">MediaShelf clipper</h1>
    <div class="sub" id="sub">Checking this page…</div>
    <button id="send" disabled>Send my list</button>
    <div id="status"></div>
  </div>

  <div id="autorow">
    <label class="switch">
      <input type="checkbox" id="autoon" />
      <span>Update these lists on a schedule</span>
    </label>
    <div id="autodetail">
      <span>every</span>
      <select id="autoevery">
        <option value="12">12 hours</option>
        <option value="24">day</option>
        <option value="168">week</option>
      </select>
      <button id="runnow">Run now</button>
    </div>
    <div id="autonote"></div>
  </div>

  <div id="urlrow">
    <label for="url">Where your MediaShelf runs</label>
    <div class="row">
      <input id="url" type="url" placeholder="http://127.0.0.1:8000" spellcheck="false" />
      <button id="saveurl">Save</button>
    </div>
    <div id="urlnote"></div>
  </div>

  <div class="foot">
    <span id="target">—</span>
    <span style="white-space:nowrap">
      <a href="#" id="update" style="display:none"
         href="https://github.com/ghltshubh/mediashelf-clipper/releases/latest">update</a>
      <span id="updatesep" style="display:none">&nbsp;·&nbsp;</span>
      <a href="#" id="edit">change</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/sponsors/ghltshubh" target="_blank" rel="noreferrer"
         title="Support MediaShelf">♥ support</a>
    </span>
  </div>

  <script src="sites.js"></script>
  <script src="readers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
